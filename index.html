<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Aplikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--surf:#fff;--ink:#0f1b2d;--mut:#5d6d82;--line:#e1e7ef;--acc:#1a73e8;--blob:.16;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--surf:#121b2c;--ink:#eaf0f8;--mut:#93a3b9;--line:#223049;--acc:#6aa9ff;--blob:.24}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:clip}

.blob{position:fixed;z-index:-1;border-radius:50%;opacity:var(--blob);pointer-events:none;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
.b1{width:48vmax;height:48vmax;left:-14vmax;top:-16vmax;background:radial-gradient(circle,#0b5ea8,transparent 68%)}
.b2{width:40vmax;height:40vmax;right:-12vmax;top:22vh;background:radial-gradient(circle,#b0801f,transparent 68%);animation-duration:31s;animation-delay:-9s}
@media (hover:none){.blob{animation:none;will-change:auto}}
@keyframes drift{to{transform:translate3d(6vmax,5vmax,0) scale(1.15)}}

.wrap{max-width:1120px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px max(48px,env(safe-area-inset-bottom))}
@media (min-width:700px){.wrap{padding-left:32px;padding-right:32px}}

.nav{display:flex;align-items:center;gap:11px;font-weight:700;font-size:1.02rem;animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--ink)}
.mark svg{width:19px;height:19px;stroke:var(--bg);fill:none;stroke-width:2;stroke-linejoin:round}

.hero{margin-top:clamp(28px,6vw,52px);text-align:center}
h1{margin:0;font-size:clamp(1.9rem,5.2vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;animation:rise .8s cubic-bezier(.2,.8,.2,1) .08s backwards}
.sub{margin:10px 0 0;color:var(--mut);font-size:clamp(.92rem,2.4vw,1.02rem);animation:rise .8s cubic-bezier(.2,.8,.2,1) .14s backwards}

.clock{display:flex;justify-content:center;align-items:flex-start;gap:clamp(5px,1.6vw,12px);margin-top:clamp(22px,4vw,32px);animation:rise .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
.seg{position:relative;display:flex;flex-direction:column;align-items:center;padding:clamp(11px,2vw,16px) clamp(11px,2.6vw,24px) 9px;border-radius:clamp(14px,2.4vw,20px);border:1px solid var(--line);background:var(--surf);overflow:hidden}
.digits{display:flex;font-size:clamp(2rem,10vw,3.7rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.digits span{display:inline-block;width:.64em;text-align:center}
.digits span.tick{animation:roll .38s cubic-bezier(.2,.8,.2,1)}
@keyframes roll{from{opacity:0;transform:translateY(-38%)}to{opacity:1;transform:none}}
.seg small{margin-top:6px;color:var(--mut);font-size:.78rem;font-weight:500}
.sep{padding-top:clamp(11px,2vw,16px);font-style:normal;font-size:clamp(2rem,10vw,3.7rem);font-weight:800;line-height:1;color:var(--mut);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.sec .digits{color:var(--acc)}
.bar-s{position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform .95s linear}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:clamp(34px,6vw,52px);padding-top:22px;border-top:1px solid var(--line)}
.bar h2{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.bar h2 span{margin-left:8px;color:var(--mut);font-size:.9rem;font-weight:500}
.tools{display:flex;gap:10px;flex:1 1 300px;justify-content:flex-end}
.search{position:relative;flex:1 1 200px;max-width:360px}
.search svg{position:absolute;left:14px;top:50%;width:17px;height:17px;translate:0 -50%;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:44px;padding:0 14px 0 40px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:12px;outline:none;transition:box-shadow .25s,border-color .25s}
.search input::placeholder{color:var(--mut)}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.ghost{height:44px;padding:0 16px;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:background .2s}
.ghost:hover{background:var(--surf)}
.ghost:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hint{margin:12px 0 0;color:var(--mut);font-size:.86rem}

.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:20px}
.card{--mx:50%;--my:50%;position:relative;display:flex;flex-direction:column;gap:6px;min-height:196px;padding:20px;border-radius:20px;border:1px solid var(--line);background:var(--surf);color:inherit;text-decoration:none;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s;animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 80ms + 300ms)}
.card[hidden]{display:none}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 22%,transparent),transparent 62%);opacity:0;transition:opacity .35s;pointer-events:none}
.card>*{position:relative}
@media (hover:hover){
  .card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 18px 36px -18px color-mix(in srgb,var(--c) 55%,transparent)}
  .card:hover::before{opacity:1}
  .card:hover .ico{transform:rotate(-6deg) scale(1.08)}
  .card:hover .go-chip{background:var(--c);border-color:var(--c);color:#fff}
}
.card:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.card.dragging{z-index:5;transition:none;cursor:grabbing;border-color:var(--c);box-shadow:0 28px 50px -18px rgba(0,0,0,.5)}
.is-dragging,.is-dragging *{cursor:grabbing!important;user-select:none}
.is-dragging .card:not(.dragging){pointer-events:none}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:auto;padding-bottom:20px}
.ico{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 8px 16px -8px var(--c);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.go-chip{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--mut);transition:all .3s}
.go-chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card h2{margin:0;font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
.card p{margin:0;color:var(--mut);font-size:.9rem;line-height:1.5}
.tag{align-self:flex-start;justify-self:start;margin-top:10px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;color:color-mix(in srgb,var(--c) 65%,var(--ink));background:color-mix(in srgb,var(--c) 12%,transparent)}
.empty{margin:44px 0 0;text-align:center;color:var(--mut)}

.veil{position:fixed;z-index:50;visibility:hidden;display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--c),var(--c2));pointer-events:none}
.veil.on{visibility:visible;pointer-events:auto}
.veil.go{transition:top .62s cubic-bezier(.76,0,.24,1),left .62s cubic-bezier(.76,0,.24,1),width .62s cubic-bezier(.76,0,.24,1),height .62s cubic-bezier(.76,0,.24,1),border-radius .62s cubic-bezier(.76,0,.24,1)}
.lab{display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;transform:translateY(12px) scale(.9);text-align:center;padding:0 24px}
.veil.go .lab{opacity:1;transform:none;transition:opacity .4s .3s,transform .5s .3s cubic-bezier(.2,.8,.2,1)}
.lab .ico{background:rgba(255,255,255,.2);box-shadow:none;width:72px;height:72px;border-radius:22px}
.lab .ico svg{width:36px;height:36px}
.lab b{font-size:1.3rem;font-weight:600}
.dots i{display:inline-block;width:7px;height:7px;margin:0 3px;border-radius:50%;background:#fff;animation:bump .9s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bump{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}

.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:60;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:.9rem;text-align:center;translate:-50% 30px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{translate:-50% 0;opacity:1}

@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media (max-width:560px){
  .tools{flex-basis:100%}.search{max-width:none}
  .grid{grid-template-columns:1fr;gap:12px}
  .card{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"i n c" "i d c" "i t c";column-gap:14px;row-gap:2px;align-items:center;min-height:0;padding:16px}
  .ctop{display:contents}
  .ico{grid-area:i;align-self:start}.go-chip{grid-area:c}
  .card h2{grid-area:n}.card p{grid-area:d}.tag{grid-area:t;margin-top:8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<main class="wrap">
  <nav class="nav"><span class="mark"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>Portal Aplikasi</nav>

  <section class="hero">
    <h1 id="salam">Halo.</h1>
    <p class="sub" id="tanggal"></p>
    <div class="clock" id="clock" role="timer" aria-label="Jam digital">
      <div class="seg"><div class="digits"><span></span><span></span></div><small>jam</small></div>
      <i class="sep">:</i>
      <div class="seg"><div class="digits"><span></span><span></span></div><small>menit</small></div>
      <i class="sep">:</i>
      <div class="seg sec"><div class="digits"><span></span><span></span></div><small>detik</small><b class="bar-s" id="barS"></b></div>
    </div>
  </section>

  <section class="bar">
    <h2>Aplikasi Saya<span id="count"></span></h2>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari aplikasi" autocomplete="off" aria-label="Cari aplikasi">
      </label>
      <button class="ghost" id="reset" type="button" hidden>Reset urutan</button>
    </div>
  </section>
  <p class="hint" id="hint"></p>

  <section class="grid" id="grid" aria-label="Daftar aplikasi"></section>
  <p class="empty" id="empty" hidden></p>
</main>

<div class="veil" id="veil" aria-hidden="true">
  <div class="lab"><div class="ico" id="vIco"></div><b id="vNama"></b><div class="dots"><i></i><i></i><i></i></div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   DAFTAR APLIKASI — ubah di sini saja.
   url   : link web app, tetap di dalam tanda kutip ' '
   c, c2 : dua warna kartu (gradasi ikon dan cahaya)
   ikon  : bolt | car | gem | grid
   Menambah aplikasi = menyalin satu baris { ... } lalu mengubah isinya.
   Urutan di bawah adalah urutan awal. Urutan hasil geser tersimpan per perangkat.
   ============================================================ */
const APPS = [
  { nama:'Catat Token PLN',  desk:'Catat token listrik, PDAM, dan WiFi tiap bulan.', tag:'Tagihan',   url:'https://pencatatan-transaksi.vercel.app/',  c:'#0b5ea8', c2:'#f6c200', ikon:'bolt' },
  { nama:'Enzy_Gempa Pro',   desk:'Kelola data kendaraan dan pengingatnya.',         tag:'Kendaraan', url:'https://kendaraan-agung-pro.vercel.app/', c:'#1a73e8', c2:'#5fb3ff', ikon:'car'  },
  { nama:'Aset Perhiasan',   desk:'Simpan data aset perhiasan lengkap dengan foto surat.', tag:'Aset', url:'https://aset-agung.vercel.app/',          c:'#b0801f', c2:'#e9c46a', ikon:'gem'  }
];

const IKON = {
  bolt:'<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  car:'<path d="M4 17v-4l2-5h12l2 5v4M4 13h16M7 17v2.5M17 17v2.5"/><circle cx="8" cy="14.8" r=".6"/><circle cx="16" cy="14.8" r=".6"/>',
  gem:'<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 9l3 12 3-12M9 9l-3-6M15 9l3-6"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IKON[k] || IKON.grid}</svg>`;
const $ = id => document.getElementById(id);
const grid = $('grid'), veil = $('veil'), toastEl = $('toast'), reset = $('reset');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const valid = u => /^https?:\/\//i.test(u);
const KEY = 'portal-urutan-v1';

/* sapaan, tanggal, dan jam digital */
let lastH = -1;
function salam(d) {
  const h = d.getHours();
  $('salam').textContent = 'Selamat ' + (h < 11 ? 'pagi' : h < 15 ? 'siang' : h < 18 ? 'sore' : 'malam') + '.';
  $('tanggal').textContent = d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
const dg = [...document.querySelectorAll('#clock .digits span')], barS = $('barS');
function tick() {
  const d = new Date(), p = n => String(n).padStart(2, '0'), sec = d.getSeconds();
  const s = p(d.getHours()) + p(d.getMinutes()) + p(sec);
  dg.forEach((el, i) => {
    if (el.textContent !== s[i]) { el.textContent = s[i]; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
  });
  barS.style.transition = sec === 0 ? 'none' : '';
  barS.style.transform = 'scaleX(' + (sec + 1) / 60 + ')';
  if (d.getHours() !== lastH) { lastH = d.getHours(); salam(d); }
  setTimeout(tick, 1000 - d.getMilliseconds());
}
tick();

/* kartu, dalam urutan yang tersimpan */
let saved = [];
try { saved = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
const rank = i => { const k = saved.indexOf(APPS[i].nama); return k < 0 ? 99 : k; };
const order = APPS.map((a, i) => i).sort((x, y) => rank(x) - rank(y) || x - y);
grid.innerHTML = order.map((i, n) => { const a = APPS[i]; return `
  <a class="card" data-i="${i}" draggable="false" href="${valid(a.url) ? a.url : '#'}" target="_top" style="--i:${n};--c:${a.c};--c2:${a.c2}">
    <div class="ctop">
      <div class="ico">${svg(a.ikon)}</div>
      <span class="go-chip"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
    </div>
    <h2>${a.nama}</h2>
    <p>${a.desk}</p>
    <span class="tag">${a.tag}</span>
  </a>`; }).join('');
reset.hidden = !saved.length;
$('hint').textContent = (matchMedia('(hover: none)').matches ? 'Tahan lalu geser kartu' : 'Tarik kartu') + ' untuk mengubah urutan. Urutan tersimpan di perangkat ini.';

function save() {
  const names = [...grid.children].map(el => APPS[el.dataset.i].nama);
  const def = names.join('|') === APPS.map(a => a.nama).join('|');
  try { def ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, JSON.stringify(names)); } catch (e) {}
  reset.hidden = def;
}

/* animasi perpindahan posisi kartu (FLIP) */
function flip(fn) {
  const cs = [...grid.children].filter(c => !c.hidden && !c.classList.contains('dragging'));
  const first = new Map(cs.map(c => [c, c.getBoundingClientRect()]));
  fn();
  cs.forEach(c => {
    const a = first.get(c), b = c.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    c.style.transition = 'none'; c.style.transform = `translate(${dx}px,${dy}px)`; void c.offsetWidth;
    c.style.transition = 'transform .3s cubic-bezier(.2,.8,.2,1)'; c.style.transform = '';
    c.addEventListener('transitionend', () => { c.style.transition = ''; }, { once:true });
  });
}

/* geser kartu: mouse langsung tarik, layar sentuh tahan sebentar lalu geser */
let drag = null, suppress = false;
function start() {
  if (!drag || drag.on) return;
  drag.on = true; drag.x = drag.x ?? drag.sx; drag.y = drag.y ?? drag.sy;
  drag.el.classList.add('dragging'); document.body.classList.add('is-dragging');
  if (navigator.vibrate) navigator.vibrate(12);
  place();
}
function place() {
  const el = drag.el, gr = grid.getBoundingClientRect(), x = drag.x, y = drag.y;
  const over = [...grid.children].find(c => c !== el && !c.hidden &&
    x >= gr.left + c.offsetLeft && x <= gr.left + c.offsetLeft + c.offsetWidth &&
    y >= gr.top + c.offsetTop && y <= gr.top + c.offsetTop + c.offsetHeight);
  if (over) flip(() => {
    const kids = [...grid.children];
    grid.insertBefore(el, kids.indexOf(over) > kids.indexOf(el) ? over.nextSibling : over);
  });
  el.style.transform = `translate(${x - drag.offX - gr.left - el.offsetLeft}px,${y - drag.offY - gr.top - el.offsetTop}px) scale(1.03)`;
}
function end() {
  if (!drag) return;
  clearTimeout(drag.timer);
  const was = drag.on, el = drag.el; drag = null;
  if (!was) return;
  el.classList.remove('dragging'); el.style.transform = '';
  document.body.classList.remove('is-dragging');
  suppress = true; setTimeout(() => { suppress = false; }, 80);
  save(); toast('Urutan disimpan.', 1500);
}
grid.addEventListener('pointerdown', e => {
  const el = e.target.closest('.card'); if (!el || e.button > 0) return;
  const r = el.getBoundingClientRect();
  drag = { el, id:e.pointerId, sx:e.clientX, sy:e.clientY, offX:e.clientX - r.left, offY:e.clientY - r.top, on:false, touch:e.pointerType === 'touch' };
  if (drag.touch) drag.timer = setTimeout(start, 320);
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.on) {
    const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if (drag.touch) { if (moved > 8) { clearTimeout(drag.timer); drag = null; } return; }
    if (moved < 6) return;
    start();
  }
  place();
});
addEventListener('pointerup', end); addEventListener('pointercancel', end);
grid.addEventListener('touchmove', e => { if (drag && drag.on) e.preventDefault(); }, { passive:false });
grid.addEventListener('contextmenu', e => { if (drag) e.preventDefault(); });
grid.addEventListener('dragstart', e => e.preventDefault());

/* keyboard: Alt + tanda panah memindahkan kartu yang difokuskan */
grid.addEventListener('keydown', e => {
  if (!e.altKey || !/^Arrow(Left|Right|Up|Down)$/.test(e.key)) return;
  const el = e.target.closest('.card'); if (!el) return;
  e.preventDefault();
  const back = /Left|Up/.test(e.key), t = back ? el.previousElementSibling : el.nextElementSibling;
  if (!t) return;
  flip(() => back ? grid.insertBefore(el, t) : grid.insertBefore(t, el));
  el.focus(); save();
});

reset.addEventListener('click', () => {
  flip(() => [...grid.children].sort((a, b) => a.dataset.i - b.dataset.i).forEach(el => grid.appendChild(el)));
  save(); toast('Urutan dikembalikan.', 1500);
});

/* cahaya mengikuti kursor */
grid.addEventListener('pointermove', e => {
  if (drag) return;
  const el = e.target.closest('.card'); if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  el.style.setProperty('--my', (e.clientY - r.top) + 'px');
});

/* klik: kartu melebar jadi layar penuh, lalu pindah ke aplikasi */
grid.addEventListener('click', e => {
  const el = e.target.closest('.card'); if (!el) return;
  if (suppress) { e.preventDefault(); return; }
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  const a = APPS[el.dataset.i];
  if (!valid(a.url)) { e.preventDefault(); toast('Link aplikasi belum diisi. Ganti nilai url pada daftar APPS di file ini.'); return; }
  if (reduce) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  veil.style.setProperty('--c', a.c); veil.style.setProperty('--c2', a.c2);
  $('vIco').innerHTML = svg(a.ikon); $('vNama').textContent = 'Membuka ' + a.nama;
  veil.className = 'veil on';
  Object.assign(veil.style, { top:r.top+'px', left:r.left+'px', width:r.width+'px', height:r.height+'px', borderRadius:'20px' });
  void veil.offsetWidth;
  veil.classList.add('go');
  Object.assign(veil.style, { top:0, left:0, width:'100vw', height:'100dvh', borderRadius:0 });
  setTimeout(() => window.open(a.url, '_top'), 700);
});
addEventListener('pageshow', () => { veil.className = 'veil'; veil.removeAttribute('style'); });

/* pencarian */
const q = $('q'), empty = $('empty'), count = $('count');
function filter() {
  const t = q.value.trim().toLowerCase(); let n = 0;
  [...grid.children].forEach(el => {
    const a = APPS[el.dataset.i];
    const ok = (a.nama + ' ' + a.desk + ' ' + a.tag).toLowerCase().includes(t);
    el.hidden = !ok; if (ok) n++;
  });
  count.textContent = n;
  empty.hidden = n > 0;
  empty.textContent = 'Tidak ada aplikasi yang cocok dengan “' + q.value.trim() + '”.';
}
q.addEventListener('input', filter); filter();
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });

let tt;
function toast(msg, ms) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), ms || 3800); }
</script>
</body>
</html>
